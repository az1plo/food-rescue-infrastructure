apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsa-be
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fsa-be
  template:
    metadata:
      labels:
        app: fsa-be
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: fsa-be
          image: acrfsamakarevychv.azurecr.io/fsa-backend:latest
          imagePullPolicy: Always
          env:
            # Nacitanie citlivych udajov pre DB z K8s secrets
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_password
            - name: FOOD_RESCUE_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: kc_client_secret
            - name: FOOD_RESCUE_SUPPORT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: support-openai-secret
                  key: provider
                  optional: true
            - name: FOOD_RESCUE_SUPPORT_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: support-openai-secret
                  key: openai_api_key
                  optional: true
            - name: FOOD_RESCUE_SUPPORT_OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: support-openai-secret
                  key: openai_model
                  optional: true
            - name: FOOD_RESCUE_SUPPORT_OPENAI_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: support-openai-secret
                  key: openai_project_id
                  optional: true
            - name: FOOD_RESCUE_SUPPORT_OPENAI_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: support-openai-secret
                  key: openai_organization_id
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: provider
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: openai_api_key
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_OPENAI_DRAFT_MODEL
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: openai_draft_model
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_OPENAI_IMAGE_MODEL
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: openai_image_model
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_OPENAI_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: openai_project_id
                  optional: true
            - name: FOOD_RESCUE_OFFER_ASSISTANT_OPENAI_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: offer-assistant-openai-secret
                  key: openai_organization_id
                  optional: true
            - name: FOOD_RESCUE_OFFER_MEDIA_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: offer-media-azure-secret
                  key: provider
                  optional: true
            - name: FOOD_RESCUE_OFFER_MEDIA_AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: offer-media-azure-secret
                  key: connection_string
                  optional: true
            - name: FOOD_RESCUE_OFFER_MEDIA_AZURE_BUSINESS_ICONS_CONTAINER
              valueFrom:
                secretKeyRef:
                  name: offer-media-azure-secret
                  key: business_icons_container
                  optional: true
            - name: FOOD_RESCUE_OFFER_MEDIA_AZURE_OFFER_IMAGES_CONTAINER
              valueFrom:
                secretKeyRef:
                  name: offer-media-azure-secret
                  key: offer_images_container
                  optional: true
            - name: FOOD_RESCUE_KEYCLOAK_BASE_URL
              value: https://app.68.219.101.242.nip.io/auth
            - name: ISSUER_URI
              value: https://app.68.219.101.242.nip.io/auth/realms/FSA
            - name: JWT_URI
              value: https://app.68.219.101.242.nip.io/auth/realms/FSA/protocol/openid-connect/certs
            # Override casti Spring Boot konfiguracie kvoli citlivym udajom
            - name: JAVA_OPTS
              value: >-
                -Dspring.datasource.url=jdbc:postgresql://${DB_URL}:5432/fsa-db
                -Dspring.datasource.username=${DB_USERNAME}
                -Dspring.datasource.password=${DB_PASSWORD}
                -Dspring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
                -Dspring.security.oauth2.resourceserver.jwt.jwk-uri=${JWT_URI}
          resources:
            limits:
              cpu: 750m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
